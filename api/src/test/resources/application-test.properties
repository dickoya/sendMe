# ── SendMe — Profil "test" (tests d'intégration H2) ──────────────────────────

# Base de données H2 en mode mémoire (compatible MySQL)
spring.datasource.url=jdbc:h2:mem:sendme_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate — création automatique du schéma à partir des entités
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Initialisation SQL — enregistre les fonctions MySQL manquantes pour H2
# Exécuté APRÈS la création du schéma Hibernate mais AVANT les @PostConstruct
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:h2-functions.sql
spring.sql.init.continue-on-error=true

# Désactiver Flyway pour les tests (H2 ne supporte pas toutes les syntaxes MySQL)
spring.flyway.enabled=false

# JWT — clé de test fixe (base64, 256 bits)
app.jwt.secret=***REMOVED_JWT_SECRET***=
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Stripe — désactivé en test (mocké)
stripe.secret.key=sk_test_mock
stripe.publishable.key=pk_test_mock
stripe.currency=eur
stripe.webhook.secret=whsec_mock

# Mail — désactivé en test (mocké)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=noreply@sendme.test
app.mail.name=SendMe Test

# OpenExchangeRates — désactivé en test (mocké)
app.openexchangerates.app-id=mock_app_id

# Stratégies de transfert — mode simulation pour les tests
strategy.simulation-mode=true
strategy.failure-rate=0

# CORS
app.cors.allowed-origins=http://localhost:5173
