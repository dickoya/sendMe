spring.application.name=sendme

# Base de donnees
spring.datasource.url=jdbc:mysql://localhost:3306/sendme_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Indique a Spring Boot de charger AUSSI le fichier "application-local.properties"
spring.profiles.active=local

# JWT
app.jwt.secret=VOTRE_CLE_JWT
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Stripe
stripe.secret.key=VOTRE_CLE_SECRETE
stripe.publishable.key=VOTRE_CLE_PUBLIC
stripe.currency=eur

# webhook
stripe.webhook.secret=whsec_METTRE_LA_CLE_ICI

# ── CORS ─────────────────────────────────────────────────────────────────────
# Origines autorisées pour les requêtes cross-origin (séparées par des virgules)
# Exemple en production : https://sendme.com,https://admin.sendme.com
app.cors.allowed-origins=http://localhost:5173


