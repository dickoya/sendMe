spring.application.name=sendme

# Port d'écoute — Railway injecte la variable PORT dynamiquement
server.port=${PORT:8080}

# ── Frontend ────────────────────────────────────────────────────────────────
# URL de base du frontend, utilisée pour les liens dans les emails (Surcharger via FRONTEND_URL)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ── Base de donnees ──────────────────────────────────────────────────────────
# Les credentials sont externalisés dans .env (profil "local")
# ou dans les variables d'environnement du système (production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sendme_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Indique a Spring Boot de charger AUSSI le fichier "application-local.properties"
spring.profiles.active=local

# ── JWT ──────────────────────────────────────────────────────────────────────
# Clé secrète pour signer les tokens JWT (minimum 32 caracteres recommande)
# Surcharger via la variable d'environnement JWT_SECRET
app.jwt.secret=${JWT_SECRET:une_cle_secrete_longue_min_32_caracteres}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ── Stripe ───────────────────────────────────────────────────────────────────
# Clés récupérables depuis https://dashboard.stripe.com/test/apikeys
# Surcharger via les variables d'environnement STRIPE_*
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_VOTRE_CLE_SECRETE_STRIPE}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test_VOTRE_CLE_PUBLIQUE_STRIPE}
stripe.currency=eur
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_VOTRE_WEBHOOK_SECRET}
# URL de retour après paiement Stripe (Surcharger via STRIPE_RETURN_URL)
stripe.return-url=${STRIPE_RETURN_URL:http://localhost:3000/payment/callback}

# ── OpenExchangeRates (taux de change) ──────────────────────────────────────
# Clé API récupérable depuis https://openexchangerates.org/signup/free
# Surcharger via la variable d'environnement OPENEXCHANGE_APP_ID
app.openexchangerates.app-id=${OPENEXCHANGE_APP_ID:VOTRE_APP_ID_OPENEXCHANGE}

# ── Strategies de transfert ──────────────────────────────────────────────────
# Mode simulation : true = delais simules + echecs aleatoires, false = appels API reels
strategy.simulation-mode=true
# Taux d'echec simule en pourcentage (0-100). Utilise uniquement si simulation-mode=true
strategy.failure-rate=5

# ── Mail SMTP ────────────────────────────────────────────────────────────────
# Configuration SMTP pour l'envoi d'emails transactionnels
# Surcharger via les variables d'environnement SPRING_MAIL_*
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
# Authentification + STARTTLS configurables (Brevo exige auth=true + STARTTLS sur le port 587)
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL:false}

# Adresse email d'envoi (from)
app.mail.from=${APP_MAIL_FROM:noreply@sendme.local}
# Nom d'affichage de l'expediteur
app.mail.name=${APP_MAIL_NAME:SendMe}


spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ── CORS ─────────────────────────────────────────────────────────────────────
# Origines autorisees pour les requetes cross-origin (separees par des virgules)
# Exemple en production : https://sendme.com,https://admin.sendme.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
