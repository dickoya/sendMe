spring.application.name=sendme

# Base de donnees
spring.datasource.url=jdbc:mysql://localhost:3306/sendme_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=***REMOVED_JWT_SECRET***=
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Stripe
stripe.secret.key=***REMOVED_STRIPE_SECRET***
stripe.publishable.key=***REMOVED_STRIPE_PUBLISHABLE***
stripe.currency=eur




